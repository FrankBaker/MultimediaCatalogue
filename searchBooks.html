<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Search</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #2f6f4f; --accent-dark: #234f38; --border: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
    max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 16px; font-size: 14px; line-height: 1.4; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  label:first-child { margin-top: 0; }
  input[type=text], select {
    width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; font-family: inherit;
  }
  .filter-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px;
  }
  .filter-grid .wide { grid-column: 1 / -1; }
  @media (max-width: 480px) {
    .filter-grid { grid-template-columns: 1fr; }
  }
  button {
    font-size: 14px; padding: 9px 14px; border-radius: 8px; border: none;
    cursor: pointer; margin-top: 12px;
  }
  button.link { background: none; color: var(--accent); text-decoration: underline; padding: 4px 0; margin-top: 8px; }
  .status { font-size: 14px; color: var(--muted); margin: 4px 0 12px; }
  .error { color: #b3261e; font-size: 14px; margin: 8px 0; }
  .hidden { display: none; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) {
    .results { grid-template-columns: 1fr; }
  }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .item h3 { margin: 0 0 6px; font-size: 15px; }
  .item .meta { font-size: 13px; color: var(--muted); margin: 2px 0; }
  .item .desc {
    font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer;
  }
  .item .desc.open { display: block; -webkit-line-clamp: unset; }
  .item .location { font-size: 13px; color: var(--accent-dark); font-weight: 600; margin-top: 8px; }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<h1>Book Search</h1>
<p class="subtitle">Search the library's books. This reads the book_backup sheet directly — no login needed.</p>

<div class="card">
  <label for="titleSearch">Title contains</label>
  <input type="text" id="titleSearch" placeholder="e.g. column of fire" autocomplete="off">

  <div class="filter-grid">
    <div>
      <label for="sectionFilter">Section</label>
      <select id="sectionFilter"><option value="">Any section</option></select>
    </div>
    <div>
      <label for="yearFilter">Year</label>
      <select id="yearFilter"><option value="">Any year</option></select>
    </div>
    <div class="wide">
      <label for="authorFilter">Author</label>
      <select id="authorFilter"><option value="">Any author</option></select>
    </div>
  </div>

  <button class="link" onclick="clearFilters()">Clear all filters</button>
</div>

<p class="status" id="resultsSummary">Loading…</p>
<div id="errorBox" class="error hidden"></div>
<div id="results" class="results"></div>

<script>
// ---------------------------------------------------------------------
// SETUP: paste the ID of the book_backup Google Sheet below. It is the
// long string in the sheet's address between /d/ and /edit, e.g.
//   https://docs.google.com/spreadsheets/d/THIS_PART_HERE/edit
// The sheet must be shared as "Anyone with the link — Viewer".
// SHEET_TAB is the tab name at the bottom of the sheet; leave '' to use
// the first tab.
// ---------------------------------------------------------------------
const SHEET_ID = '1UeetnXOaJJZi2LSOBhODBDUiL9HnNnBHRV6-yP9bZS0';
const SHEET_TAB = '';

// Which sheet columns feed each search field. Several columns can be
// listed; their values are merged. Section is the Category column
// (ENG FICTION, AFR FIKSIE …). Tags are shown on each result, not searched;
// several tags in one cell may be separated by ; or ,. Multiple authors in
// one cell are separated by ; or "and" or "&" (a comma is kept, so
// "Baldacci, David" stays one author).
const COLUMNS = {
  title:  'Title',
  section: 'Category',
  tags:   ['Tags'],
  author: ['Authors', 'Co-authors'],
  year:   'Year',
  desc:   'Description',
  callNo: 'Call No'
};

let allItems = [];
let authorName = {};   // author key -> the name shown on screen

function $(id) { return document.getElementById(id); }

function cell(item, col) { return String(item[col] == null ? '' : item[col]).trim(); }

function splitMulti(value, separators) {
  return String(value || '')
    .split(separators || /[;,]/)
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 0; });
}

function multiValues(item, cols) {
  const out = [];
  cols.forEach(function (c) {
    splitMulti(cell(item, c)).forEach(function (v) { if (out.indexOf(v) === -1) out.push(v); });
  });
  return out;
}

// Remove notes in brackets: "(author)", "(Ed)", "(illus)", "(b. 1940-)".
function cleanAuthorName(name) {
  return name.replace(/\([^)]*\)/g, ' ').replace(/^[\s,]+|[\s,]+$/g, '').replace(/\s*,\s*,/g, ',');
}

// ---- Author matching ------------------------------------------------
// "BALDACCI DAVID", "Baldacci David", "Baldacci, David" and "David Baldacci"
// all reduce to the same key: lower case, punctuation dropped, words sorted.
function authorKey(name) {
  name = cleanAuthorName(name);
  // web-address style "child-lee" -> "child lee"
  if (/^[a-z]+(-[a-z]+)+$/.test(name)) name = name.replace(/-/g, ' ');
  return name.toLowerCase()
    .replace(/[.,'’"()]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .sort().join(' ');
}

function isAllCaps(s) { return s === s.toUpperCase() && s !== s.toLowerCase(); }

// "BALDACCI DAVID" -> "Baldacci David", "O'BRIEN" -> "O'Brien", "MCEWAN" -> "McEwan".
// Short letter groups like "PJ" or "R.R." are left as initials.
function tidyCaps(s) {
  return s.split(' ').map(function (w) {
    if (w.replace(/[^A-Za-z]/g, '').length <= 2) return w;
    return w.toLowerCase()
      .replace(/(^|[\-'’(.])([a-z])/g, function (m, p, c) { return p + c.toUpperCase(); })
      .replace(/^Mc([a-z])/, function (m, c) { return 'Mc' + c.toUpperCase(); });
  }).join(' ');
}

// Several authors in one cell: "Patterson, James; Paetro, Maxine",
// "James Patterson and Maxine Paetro", "Clancy, Tom & Greaney, Mark".
const AUTHOR_SEP = /;|\s+&\s+|\s+and\s+/i;

// Names that mean "no author recorded" — left out of the Author list.
const NOT_AN_AUTHOR = ['unknown', 'unknown author', 'author unknown'];

// Words that belong with the surname: "Marlena De Blasi" -> "De Blasi, Marlena".
const SURNAME_PARTICLES = ['de', 'du', 'van', 'von', 'der', 'den', 'le', 'la', 'da', 'di', 'del', 'st', 'st.', 'ten', 'ter'];

// Put any spelling into library style "Surname, Given names".
//   "Follett, Ken"    -> "Follett, Ken"     (already library style)
//   "BALDACCI  DAVID" -> "Baldacci, David"  (two spaces = surname first)
//   "Ken Follett"     -> "Follett, Ken"     (last word = surname)
function surnameFirst(name) {
  let surname, given;
  if (name.indexOf(',') !== -1) {
    const i = name.indexOf(',');
    surname = name.slice(0, i); given = name.slice(i + 1);
  } else if (/\S\s{2,}\S/.test(name)) {
    const m = name.match(/^(.*?\S)\s{2,}(\S.*)$/);
    surname = m[1]; given = m[2];
  } else {
    const words = name.split(/\s+/);
    if (words.length === 1) return name;
    let i = words.length - 1;
    while (i > 1 && SURNAME_PARTICLES.indexOf(words[i - 1].toLowerCase()) !== -1) i--;
    surname = words.slice(i).join(' '); given = words.slice(0, i).join(' ');
  }
  surname = surname.replace(/\s+/g, ' ').trim();
  given = given.replace(/\s+/g, ' ').trim();
  // "John." -> "John", but keep the full stop on initials like "P. D."
  if (/[A-Za-z]{2,}\.$/.test(given)) given = given.slice(0, -1);
  return given ? surname + ', ' + given : surname;
}

function authorsOf(item) {
  const keys = [];
  COLUMNS.author.forEach(function (c) {
    splitMulti(cell(item, c), AUTHOR_SEP).forEach(function (n) {
      const k = authorKey(n);
      if (k && NOT_AN_AUTHOR.map(authorKey).indexOf(k) === -1 && keys.indexOf(k) === -1) keys.push(k);
    });
  });
  return keys;
}

// For each author key, choose one spelling to show, in "Surname, Given"
// form. Spellings already written with a comma (library style) win, then
// "SURNAME  GIVEN" with a double space, then "Given Surname"; within each,
// the most common one that isn't in ALL CAPS.
function buildAuthorNames(items) {
  const counts = {};
  items.forEach(function (item) {
    COLUMNS.author.forEach(function (c) {
      splitMulti(cell(item, c), AUTHOR_SEP).forEach(function (n) {
        const k = authorKey(n);
        if (!k) return;
        counts[k] = counts[k] || {};
        counts[k][n] = (counts[k][n] || 0) + 1;
      });
    });
  });
  function rank(v) {
    v = cleanAuthorName(v);
    if (/^[a-z]+(-[a-z]+)+$/.test(v)) return 9;            // "child-lee"
    const oddCase = isAllCaps(v) || v === v.toLowerCase() ? 1 : 0;
    return (v.indexOf(',') !== -1 ? 0 : /\S\s{2,}\S/.test(v) ? 2 : 4) + oddCase;
  }
  authorName = {};
  Object.keys(counts).forEach(function (k) {
    const best = Object.keys(counts[k]).sort(function (a, b) {
      return rank(a) - rank(b) || counts[k][b] - counts[k][a];
    })[0];
    let b = cleanAuthorName(best);
    if (/^[a-z]+(-[a-z]+)+$/.test(b)) b = b.replace(/-/g, ' ');
    // Fix capitals word by word: "ALLENDE, Isabel" -> "Allende, Isabel",
    // "clark, mary higgins" -> "Clark, Mary Higgins".
    authorName[k] = surnameFirst(b).split(', ').map(function (part) {
      return (isAllCaps(part) || part === part.toLowerCase()) ? tidyCaps(part.toUpperCase()) : part;
    }).join(', ');
  });
  items.forEach(function (item) { item._authors = authorsOf(item); });
}

function showAuthor(key) { return authorName[key] || key; }

// ---- Tags (shown on results) ----------------------------------------
// "Thriller", "thriller" and "Thriller." are shown as one tag.
let tagName = {};
function tagKey(g) { return g.toLowerCase().replace(/\.+$/, '').replace(/\s+/g, ' ').trim(); }
function tagsOf(item) {
  const keys = [];
  COLUMNS.tags.forEach(function (c) {
    splitMulti(cell(item, c)).forEach(function (g) {
      const k = tagKey(g);
      if (k && keys.indexOf(k) === -1) keys.push(k);
    });
  });
  return keys;
}
function buildTagNames(items) {
  const counts = {};
  items.forEach(function (item) {
    COLUMNS.tags.forEach(function (c) {
      splitMulti(cell(item, c)).forEach(function (g) {
        g = g.replace(/\.+$/, '').replace(/\s+/g, ' ').trim();
        const k = tagKey(g);
        if (!k) return;
        counts[k] = counts[k] || {};
        counts[k][g] = (counts[k][g] || 0) + 1;
      });
    });
  });
  tagName = {};
  Object.keys(counts).forEach(function (k) {
    const best = Object.keys(counts[k]).sort(function (a, b) {
      const ua = /^[A-Z]/.test(a) && !isAllCaps(a) ? 0 : 1, ub = /^[A-Z]/.test(b) && !isAllCaps(b) ? 0 : 1;
      return ua - ub || counts[k][b] - counts[k][a];
    })[0];
    tagName[k] = isAllCaps(best) ? tidyCaps(best) : best.charAt(0).toUpperCase() + best.slice(1);
  });
  items.forEach(function (item) { item._tags = tagsOf(item); });
}
function showTag(key) { return tagName[key] || key; }

function sectionOf(item) { return cell(item, COLUMNS.section).replace(/\s+/g, ' '); }

// Normalise year: Sheets may hand back 2023 as "2023.0" or "2023.00".
function yearOf(item) {
  return cell(item, COLUMNS.year).replace(/\.0+$/, '');
}

// Minimal but complete CSV parser (handles quotes, commas and line
// breaks inside descriptions).
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function init() {
  try {
    let url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:csv&headers=1';
    if (SHEET_TAB) url += '&sheet=' + encodeURIComponent(SHEET_TAB);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    if (text.trim().charAt(0) === '<') {
      showError('The sheet is not shared publicly. In Google Sheets choose Share → General access → "Anyone with the link" → Viewer.');
      return;
    }
    const rows = parseCSV(text);
    const headers = (rows.shift() || []).map(function (h) { return h.trim(); });
    allItems = rows
      .map(function (r) {
        const o = {};
        headers.forEach(function (h, i) { o[h] = r[i]; });
        return o;
      })
      .filter(function (o) {
        // Skip blank rows and books marked inactive (withdrawn/lost).
        return cell(o, COLUMNS.title) && cell(o, 'Is Active').toLowerCase() !== 'no';
      });
    buildAuthorNames(allItems);
    buildTagNames(allItems);
    allItems.sort(compareBooks);
    render();
  } catch (err) {
    showError('Could not load the book catalogue — check your connection and reload.');
  }

  ['input', 'change'].forEach(function (evt) {
    $('titleSearch').addEventListener(evt, render);
    $('sectionFilter').addEventListener(evt, render);
    $('yearFilter').addEventListener(evt, render);
    $('authorFilter').addEventListener(evt, render);
  });
}

// Sort "A Column of Fire" under C, "The Hobbit" under H.
function sortKey(title) {
  return title.toLowerCase().replace(/^(the|a|an)\s+/, '');
}

// Results order: by first author (as shown), then by title. Books with no
// author go to the end.
function compareBooks(a, b) {
  const aa = a._authors.length ? showAuthor(a._authors[0]) : '\uffff';
  const ba = b._authors.length ? showAuthor(b._authors[0]) : '\uffff';
  return byText(aa, ba) ||
         byText(sortKey(cell(a, COLUMNS.title)), sortKey(cell(b, COLUMNS.title)));
}

function showError(msg) {
  $('errorBox').textContent = msg;
  $('errorBox').classList.remove('hidden');
  $('resultsSummary').textContent = '';
}

// Does this item satisfy filter set f? Any field left as '' in f is not
// constrained. f: { text, section, year, author }
function itemMatches(item, f) {
  if (f.text && cell(item, COLUMNS.title).toLowerCase().indexOf(f.text) === -1) return false;
  if (f.section && sectionOf(item) !== f.section) return false;
  if (f.year && yearOf(item) !== f.year) return false;
  if (f.author && item._authors.indexOf(f.author) === -1) return false;
  return true;
}

// The values available for one dropdown, given the CURRENT state of every
// OTHER filter (not this one's own selection) — this is what makes the
// filters progressive: picking a section narrows the author/year dropdowns,
// and vice versa.
function optionsFor(field, raw) {
  const relaxed = Object.assign({}, raw);
  relaxed[field] = '';
  const subset = allItems.filter(function (item) { return itemMatches(item, relaxed); });
  const values = new Set();
  subset.forEach(function (item) {
    if (field === 'section') { const sec = sectionOf(item); if (sec) values.add(sec); }
    else if (field === 'author') item._authors.forEach(function (v) { values.add(v); });
    else if (field === 'year') { const y = yearOf(item); if (y) values.add(y); }
  });
  return Array.from(values);
}

function rebuildSelect(id, anyLabel, values, selectedValue, labelOf) {
  const sel = $(id);
  sel.innerHTML = '';
  const anyOpt = document.createElement('option');
  anyOpt.value = '';
  anyOpt.textContent = anyLabel;
  sel.appendChild(anyOpt);
  values.forEach(function (v) {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = labelOf ? labelOf(v) : v;
    sel.appendChild(opt);
  });
  sel.value = selectedValue;
}

function clearFilters() {
  $('titleSearch').value = '';
  $('sectionFilter').value = '';
  $('yearFilter').value = '';
  $('authorFilter').value = '';
  render();
}

function byText(a, b) { return a.localeCompare(b, undefined, { sensitivity: 'base' }); }

function render() {
  const raw = {
    text: $('titleSearch').value.trim().toLowerCase(),
    section: $('sectionFilter').value,
    year: $('yearFilter').value,
    author: $('authorFilter').value
  };

  const sectionOptions = optionsFor('section', raw).sort(byText);
  const yearOptions = optionsFor('year', raw).sort().reverse();
  const authorOptions = optionsFor('author', raw).sort(function (a, b) { return byText(showAuthor(a), showAuthor(b)); });

  // Drop a selection back to "Any" if the other filters have made it impossible.
  const kept = {
    text: raw.text,
    section: sectionOptions.indexOf(raw.section) !== -1 ? raw.section : '',
    year: yearOptions.indexOf(raw.year) !== -1 ? raw.year : '',
    author: authorOptions.indexOf(raw.author) !== -1 ? raw.author : ''
  };

  rebuildSelect('sectionFilter', 'Any section', sectionOptions, kept.section);
  rebuildSelect('yearFilter', 'Any year', yearOptions, kept.year);
  rebuildSelect('authorFilter', 'Any author', authorOptions, kept.author, showAuthor);

  const matches = allItems.filter(function (item) { return itemMatches(item, kept); });

  $('resultsSummary').textContent = allItems.length === 0
    ? 'No books catalogued yet.'
    : matches.length + ' of ' + allItems.length + ' books shown.';

  const container = $('results');
  container.innerHTML = '';
  if (matches.length === 0 && allItems.length > 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No matches — try clearing a filter.';
    container.appendChild(empty);
    return;
  }

  // Draw at most 300 cards at once so phones stay quick with a big catalogue.
  matches.slice(0, 300).forEach(function (item) {
    container.appendChild(renderItem(item));
  });
  if (matches.length > 300) {
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = 'Showing the first 300 — narrow the search to see the rest.';
    container.appendChild(more);
  }
}

function renderItem(item) {
  const div = document.createElement('div');
  div.className = 'item';

  const h3 = document.createElement('h3');
  h3.textContent = cell(item, COLUMNS.title) || '(untitled)';
  div.appendChild(h3);

  const lines = [
    ['Author', item._authors.map(showAuthor).join('; ')],
    ['Section', sectionOf(item)],
    ['Year', yearOf(item)],
    ['Tags', item._tags.map(showTag).join(', ')]
  ];
  lines.forEach(function (pair) {
    if (!pair[1]) return;
    const p = document.createElement('div');
    p.className = 'meta';
    p.textContent = pair[0] + ': ' + pair[1];
    div.appendChild(p);
  });

  const desc = cell(item, COLUMNS.desc);
  if (desc) {
    const d = document.createElement('div');
    d.className = 'desc';
    d.title = 'Tap to show more or less';
    d.textContent = desc;
    d.addEventListener('click', function () { d.classList.toggle('open'); });
    div.appendChild(d);
  }

  const callNo = cell(item, COLUMNS.callNo);
  if (callNo) {
    const loc = document.createElement('div');
    loc.className = 'location';
    loc.textContent = '📍 Shelf: ' + callNo;
    div.appendChild(loc);
  }

  return div;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
