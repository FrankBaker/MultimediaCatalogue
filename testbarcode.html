<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f6f6f6;
      color: #222;
    }
    h1 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      min-height: 60px;
    }
    .controls { margin: 16px 0; display: flex; gap: 12px; justify-content: center; }
    button {
      font-size: 1rem;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #0a7cff;
      color: #fff;
    }
    button:disabled { background: #b8c4d0; }
    #stopBtn { background: #555; }
    #status { color: #666; font-size: 0.95rem; min-height: 1.4em; }
    #result {
      margin: 16px auto 0;
      max-width: 500px;
      font-size: 1.2rem;
      word-break: break-all;
      background: #fff;
      border-radius: 8px;
      padding: 14px;
    }
    #result .format { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; }
    #history { max-width: 500px; margin: 12px auto; padding: 0; list-style: none; text-align: left; font-size: 0.9rem; color: #444; }
    #history li { padding: 4px 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>

  <h1>Barcode Scanner</h1>

  <div id="reader"></div>

  <div class="controls">
    <button id="startBtn">Start camera</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <div id="status">Tap "Start camera" and point it at a barcode.</div>

  <div id="result">Scan result will show here</div>
  <ul id="history"></ul>

  <!-- html5-qrcode library, pinned to a known version -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const historyEl = document.getElementById('history');

    function setStatus(msg) { statusEl.textContent = msg; }

    // The camera only works on a secure page (https:// or localhost).
    // On an iPhone, opening the file directly or over plain http won't work.
    if (!window.isSecureContext) {
      setStatus('Camera needs a secure page (https:// or localhost). Open this page over https.');
    }

    if (typeof Html5Qrcode === 'undefined') {
      setStatus('Could not load the scanner library (no internet connection?).');
      startBtn.disabled = true;
    }

    // Common 1D barcodes plus QR codes.
    const F = window.Html5QrcodeSupportedFormats || {};
    const formats = [
      F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39,
      F.CODE_93, F.ITF, F.CODABAR, F.QR_CODE
    ].filter(f => f !== undefined);

    let html5QrCode = null;
    let lastText = null;

    function onScanSuccess(decodedText, decodedResult) {
      const format = decodedResult && decodedResult.result && decodedResult.result.format
        ? decodedResult.result.format.formatName : '';
      resultEl.innerHTML = '';
      resultEl.append('Result: ' + decodedText);
      if (format) {
        const f = document.createElement('span');
        f.className = 'format';
        f.textContent = format;
        resultEl.append(f);
      }
      if (decodedText !== lastText) {
        lastText = decodedText;
        const li = document.createElement('li');
        li.textContent = new Date().toLocaleTimeString() + '  ' + decodedText + (format ? '  (' + format + ')' : '');
        historyEl.prepend(li);
        if (navigator.vibrate) navigator.vibrate(100);
      }
      // To stop after the first successful scan, uncomment:
      // stopScanner();
    }

    function onScanFailure(error) {
      // Called for every frame without a readable code -- safe to ignore.
    }

    async function startScanner() {
      startBtn.disabled = true;
      setStatus('Starting camera...');
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode('reader', {
            formatsToSupport: formats,
            // Use the browser's built-in barcode detector where available (faster, better at 1D barcodes).
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            verbose: false
          });
        }
        await html5QrCode.start(
          { facingMode: 'environment' },   // rear camera on phones
          {
            fps: 10,
            // Wide, short box suits 1D barcodes; scales with the video size.
            qrbox: (w, h) => {
              const width = Math.floor(Math.min(w * 0.85, 400));
              return { width, height: Math.floor(Math.min(h * 0.5, width * 0.5)) };
            }
          },
          onScanSuccess,
          onScanFailure
        );
        stopBtn.disabled = false;
        setStatus('Scanning... hold the barcode inside the box.');
      } catch (err) {
        startBtn.disabled = false;
        setStatus('Camera access denied or not supported: ' + err);
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      stopBtn.disabled = true;
      startBtn.disabled = false;
      setStatus('Camera stopped.');
    }

    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
  </script>
</body>
</html>
